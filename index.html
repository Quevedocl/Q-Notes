catch(e){if(e.name==='AbortError')throw new Error('La IA tardó demasiado en responder. Prueba con menos contenido.');if(e instanceof TypeError)throw new Error('No se pudo contactar a la IA. Revisa tu conexión a internet.');if(retry&&(e.status===502||e.status===503)){await new Promise(r=>setTimeout(r,1500));return aiCall(a,img,0)}throw e}finally{clearTimeout(to)}}

for(const r of rows){const d=r.data;if(!d||!d.id)continue;const l=await st.get(d.id);if(l&&l.updatedAt>=d.updatedAt)continue;

async function sync(){if(!sb||!user||!navigator.onLine)return;if(syncing){again=true;return}syncing=true;clearTimeout(retryT);const uid=user.id;
try{const pk='qn_push_'+uid,old=localStorage['qn_last_'+uid];if(localStorage[pk]==null&&old)localStorage[pk]=old

 const ln=(await db.notebooks.where('updatedAt').above(last).toArray()).filter(fl),lp=(await db.pages.where('updatedAt').above(last).toArray()).filter(fl);
 if(ln.length||lp.length)setSync('sync');let mx=last;
 if(ln.length){const{error}=await sb.from('notebooks').upsert(ln.map(d=>({id:d.id,user_id:uid,data:d,updated_at:d.updatedAt})));if(error)throw error;mx=Math.max(mx,...ln.map(d=>d.updatedAt))}

  for(;;){const{data,error}=await sb.from(tb).select('data,updated_at').eq('user_id',uid).gt('updated_at',from).order('updated_at',{ascending:true}).limit(30);if(error)throw error;if(!data.length)break;changed+=await applyRows(tb,data);from=Math.max(from,...data.map(r=>+r.updated_at||0));localStorage[key]=from;if(data.length<30)break}}

finally{syncing=false;if(again){again=false;syncSoon()}}}

// ===== Efectos: ondas al tocar y tarjetas 3D =====
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button:not(.dot):not(.sw2):not(.zp)');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,u=document.createElement('u');u.className='rp';u.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(u);setTimeout(()=>u.remove(),600)});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const n=e.target.closest&&e.target.closest('.nb,.hc');if(!n)return;const r=n.getBoundingClientRect();n.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');n.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*12+'deg')});
document.addEventListener('pointerout',e=>{const n=e.target.closest&&e.target.closest('.nb,.hc');if(n&&!n.contains(e.relatedTarget)){n.style.removeProperty('--rx');n.style.removeProperty('--ry')}});
