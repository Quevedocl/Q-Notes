function coverHTML(nb){const cv=nb.cover,tx={lino:'repeating-linear-gradient(0deg,#ffffff12 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#0000000f 0 1px,transparent 1px 3px)',cuero:'radial-gradient(#0003 1px,transparent 1.5px) 0 0/5px 5px,radial-gradient(#ffffff1a 1px,transparent 1.5px) 2px 2px/7px 7px',madera:'repeating-linear-gradient(90deg,#3c1e0a48 0 2px,transparent 2px 9px,#ffdcaa1f 9px 10px,transparent 10px 17px)',carbono:'linear-gradient(45deg,#0004 25%,transparent 25% 75%,#0004 75%) 0 0/8px 8px,linear-gradient(45deg,#ffffff10 25%,transparent 25% 75%,#ffffff10 75%) 4px 4px/8px 8px',papel:'repeating-linear-gradient(0deg,#00000010 0 1px,transparent 1px 4px),radial-gradient(#0002 1px,transparent 1.5px) 0 0/6px 6px',puntos:'radial-gradient(#ffffff40 2px,transparent 2.5px) 0 0/14px 14px',rayas:'repeating-linear-gradient(45deg,#ffffff18 0 6px,transparent 6px 14px)'}[cv.tex]||'';
return `<div class="cover" style="background:${tx?tx+',':''}linear-gradient(135deg,${cv.c1},${cv.c2})"><i class="${{espiral:'sp',argollas:'rg',lomo:'lm',banda:'bd'}[cv.bind]||''}"></i><b class="ct" style="color:${cv.tc||'#fff'};font-family:${cv.ff||'inherit'};font-size:${cv.fs||17}px">${esc(nb.title)}</b><span class="st">${esc(cv.st||'')}</span></div>`}

// ===== Estantería =====
async function loadNbs(){const a=await db.notebooks.toArray();S.nbs=a.filter(n=>!n.deleted).sort((x,y)=>y.updatedAt-x.updatedAt);S.trash=a.filter(n=>n.deleted)}
function shelf(){S.nb=null;cur=null;if(!S.tab)S.tab='docs';const fl=JSON.parse(localStorage.qn_folders||'[]'),fs=[...new Set([...S.nbs.map(n=>n.folder).filter(Boolean),...fl])],tr=S.tab==='trash',q=S.q.toLowerCase(),an=S.noan?'':'an',list=(tr?S.trash:S.nbs).filter(n=>(S.tab!=='fav'||n.fav)&&(tr||S.folder==='Todos'||n.folder===S.folder)&&n.title.toLowerCase().includes(q)),nv=(t,k,l,c)=>`<button class="${S.tab===k&&(k!=='docs'||S.folder==='Todos')?'on':''}" onclick="S.tab='${k}';S.folder='Todos';shelf()">${ic(t)}<span style="flex:1;text-align:left">${l}</span><span class="mut">${c}</span></button>`;
$('#app').innerHTML=`<header><button onclick="S.sbc=!S.sbc;shelf()" title="Panel lateral">${ic('side')}</button><h1 style="flex:1"><span class="logo">Q-Notes</span></h1><input id="q" placeholder="Buscar cuadernos" value="${esc(S.q)}" oninput="S.q=this.value;shelf()" style="width:200px;flex:none"><span class="mut" id="stat">${user?'☁ '+esc(user.email):'Solo local'}</span><button onclick="cfgModal()">${ic('gear')}</button><button class="p" onclick="nuevoMenu()">${ic('plus')} Nuevo</button></header>
<div class="lib ${S.sbc?'c':''}"><aside class="side">${nv('grid','docs','Documentos',S.nbs.length)}${nv('star','fav','Favoritos',S.nbs.filter(n=>n.fav).length)}${nv('trash','trash','Papelera',S.trash.length)}<h6>Carpetas</h6>${fs.map(f=>`<button class="${S.tab==='docs'&&f===S.folder?'on':''}" onclick="S.tab='docs';S.folder='${esc(f)}';shelf()">${ic('folder')}<span>${esc(f)}</span></button>`).join('')}<button onclick="newFolder()">${ic('plus')}<span>Nueva carpeta</span></button></aside>
<div class="shelf"><h2 style="margin:0 0 20px;font-size:28px;letter-spacing:-.03em">${tr?'Papelera':S.tab==='fav'?'Favoritos':S.folder==='Todos'?'Documentos':esc(S.folder)}${tr?'<button style="margin-left:14px;font-size:13px" onclick="emptyTrash()">Vaciar</button>':''}</h2>
<div class="grid">${list.map((n,i)=>`<div class="nb ${an}" style="--i:${i}" onclick="${tr?'':`openNb('${n.id}')`}">${tr?`<button class="del" onclick="event.stopPropagation();restoreNb('${n.id}')">${ic('undo')}</button><button class="del rn" onclick="event.stopPropagation();permDel('${n.id}',1)">${ic('x')}</button>`:`<button class="del" onclick="event.stopPropagation();delNb('${n.id}')">${ic('trash')}</button><button class="del rn" onclick="event.stopPropagation();editNb('${n.id}')">${ic('pen')}</button><button class="del fv ${n.fav?'f':''}" onclick="event.stopPropagation();fav('${n.id}')">${ic('star')}</button>`}${coverHTML(n)}<div style="margin-top:10px;text-align:center;font-weight:550" class="mut">${esc(n.title)}</div></div>`).join('')||'<p class="mut">Nada por aquí. Crea algo con “Nuevo”.</p>'}</div></div></div><input type="file" id="fi" accept="application/pdf,.qnotes,.json,image/*" hidden onchange="impFile(event)"><input type="file" id="fs" accept="image/*" capture="environment" hidden onchange="scan(event)">`;
S.noan=1;if(S.q){const q=$('#q');q.focus();q.setSelectionRange(99,99)}}
async function fav(id){const n=await db.notebooks.get(id);n.fav=!n.fav;n.updatedAt=Date.now();await db.notebooks.put(n);await loadNbs();shelf();syncSoon()}

async function quickNb(t,tpl,bg){const nb={id:uid(),title:t,folder:'',template:tpl,cover:{c1:GR[3][0],c2:GR[3][1],tex:'solid',bind:'lomo',st:'⚡'},updatedAt:Date.now()};await db.notebooks.add(nb);await db.pages.add(mkPage(nb.id,1,tpl,bg));await loadNbs();syncSoon();await openNb(nb.id)}

async function scan(e,f){f=f||e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d'),k=Math.min(c.width/im.width,c.height/im.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,(c.width-im.width*k)/2,(c.height-im.height*k)/2,im.width*k,im.height*k);await quickNb('Escaneo '+new Date().toLocaleDateString(),'blank',c.toDataURL('image/jpeg',.82))};im.src=URL.createObjectURL(f)}
async function impFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{if(/\.(qnotes|json)$/i.test(f.name)){const j=JSON.parse(await f.text()),id=uid();Object.assign(j.nb,{id,deleted:false,updatedAt:Date.now()});await db.notebooks.add(j.nb);for(const p of j.pages)await db.pages.add({...p,id:uid(),notebookId:id,updatedAt:Date.now()});await loadNbs();syncSoon();shelf();toast('Cuaderno importado ✔')}else if(f.type.startsWith('image/'))scan(e,f);else{await quickNb(f.name.replace(/\.pdf$/i,''),'blank');await importPdf({target:{files:[f],value:''}});const p=S.pages.shift();p.deleted=true;p.updatedAt=Date.now();await db.pages.put(p);renum();S.i=0;loadPage();tools()}}catch(x){console.error(x);toast('No se pudo importar')}}

const o=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join(''),c=NB.cover,m=document.createElement('div');m.className='modal';m.id='m';

document.body.appendChild(m);pv();$('#nt').oninput=pv}

async function openNb(id){S.nb=await db.notebooks.get(id);S.pages=(await db.pages.where('notebookId').equals(id).toArray()).filter(p=>!p.deleted).sort((a,b)=>a.n-b.n);S.i=0;editor()}
function editor(){S.noan=0;$('#app').innerHTML=`<header><button onclick="shelf()">${ic('bl')}Biblioteca</button><h1 style="flex:1;text-align:center">${esc(S.nb.title)} <span class="mut" id="pn"></span></h1><span class="mut" id="stat">${user?'☁ sincronizado':'Solo local'}</span><button onclick="go(-1)">${ic('bl')}</button><button onclick="go(1)">${ic('br')}</button><button title="Páginas" onclick="pagesModal()">${ic('grid')}</button><button id="mb" onclick="menu()">${ic('more')}</button></header>
<div class="ed"><div id="paper"><canvas id="base"></canvas><canvas id="live"></canvas></div></div><div id="tools"></div><input type="file" id="pdfin" accept="application/pdf" hidden onchange="importPdf(event)"><input type="file" id="imgin" accept="image/*" hidden onchange="addImg(event)">`;
base=$('#base');live=$('#live');base.width=live.width=W*2;base.height=live.height=H*2;bctx=base.getContext('2d');lctx=live.getContext('2d');bctx.scale(2,2);lctx.scale(2,2);
live.onpointerdown=pdown;live.onpointermove=pmove;live.onpointerup=live.onpointercancel=pup;fit();loadPage();tools();gest()}
function fit(){const p=$('#paper');if(!p)return;const s=Math.min((innerWidth-12)/W,(innerHeight-($('header').style.display==='none'?24:76))/H);p.style.width=W*s+'px';p.style.height=H*s+'px'}
addEventListener('resize',fit);

// ===== Plantillas =====
function tpl(c,t,p){tpl0(c,t);if(p==='cream'){c.globalCompositeOperation='multiply';c.fillStyle='#fbf0d0';c.fillRect(0,0,W,H)}if(p==='dark'){c.globalCompositeOperation='difference';c.fillStyle='#e4e6ee';c.fillRect(0,0,W,H)}c.globalCompositeOperation='source-over'}
function tpl0(c,t){c.fillStyle='#fff';c.fillRect(0,0,W,H);c.lineWidth=1;const L=(x1,y1,x2,y2,col)=>{c.strokeStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};const bl='#9ec1f5',gr='#dfe5ee';
if(t==='lined'||t==='todo'){for(let y=90;y<H-30;y+=34)L(t==='todo'?250:40,y,W-40,y,bl);if(t==='lined')L(80,0,80,H,'#f4a3a3')}
if(t==='todo'){L(235,40,235,H-40,'#f4a3a3');c.fillStyle='#64748b';c.font='bold 16px sans-serif';c.fillText('Tareas',40,66);c.strokeStyle='#94a3b8';for(let y=90;y<H-60;y+=40)c.strokeRect(42,y-18,18,18)}
if(t==='grid')for(let k=30;k<W;k+=30)L(k,0,k,H,gr),0,[...Array(Math.floor(H/30))].forEach((_,j)=>L(0,j*30+30,W,j*30+30,gr));
if(t==='dotted'){c.fillStyle='#b6bfce';for(let x=40;x<W;x+=30)for(let y=40;y<H;y+=30){c.beginPath();c.arc(x,y,1.6,0,7);c.fill()}}
if(t==='staff')for(let y=70;y<H-60;y+=110)for(let k=0;k<5;k++)L(40,y+k*11,W-40,y+k*11,'#475569');
if(t==='planner'){c.fillStyle='#64748b';c.font='bold 14px sans-serif';const d=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],bh=(H-100)/4;d.forEach((n,k)=>{const x=40+(k%2)*370,y=60+Math.floor(k/2)*bh;c.strokeStyle='#cbd5e1';c.strokeRect(x,y,360,bh-12);c.fillText(n,x+10,y+20)});c.strokeRect(410,60+3*bh,360,bh-12);c.fillText('Notas',420,80+3*bh)}}
function ld(u){let m=imc[u];if(m&&m.complete&&m.naturalWidth)return Promise.resolve(m);m=imc[u]||(imc[u]=new Image());return new Promise(r=>{m.onload=m.onerror=()=>r(m);if(!m.src)m.src=u})}
function stroke(c,s){c.save();c.lineCap=c.lineJoin='round';c.strokeStyle=c.fillStyle=s.c;const p=s.p;
if(s.t==='x'){c.font=`${s.w*5+10}px -apple-system,sans-serif`;c.textBaseline='top';s.s.split('\n').forEach((l,i)=>c.fillText(l,p[0][0],p[0][1]+i*(s.w*6+12)))}
else if(s.t==='i'){const m=imc[s.s];if(m&&m.complete&&m.naturalWidth)c.drawImage(m,p[0][0],p[0][1],p[1][0]-p[0][0],p[1][1]-p[0][1]);else ld(s.s).then(()=>{if(c===bctx)paint()})}
else if(s.t==='s'){const[a,b]=p;c.lineWidth=s.w;c.beginPath();if(s.k==='rect')c.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);else if(s.k==='ell')c.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2||1,Math.abs(b[1]-a[1])/2||1,0,0,7);else{c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);if(s.k==='arr'){const g=Math.atan2(b[1]-a[1],b[0]-a[0]),h=14+s.w*2;[.45,-.45].forEach(d=>{c.moveTo(b[0],b[1]);c.lineTo(b[0]+h*Math.cos(g+Math.PI+d),b[1]+h*Math.sin(g+Math.PI+d))})}}if(s.f&&(s.k==='rect'||s.k==='ell')){c.globalAlpha=.25;c.fill();c.globalAlpha=1}c.stroke()}
else if(s.t==='b')stroke0(c,{...s,p:p.map(a=>[a[0],a[1],.45])});
else if(s.t==='br')stroke0(c,{...s,w:s.w*1.7,p:p.map(a=>[a[0],a[1],Math.min(1.5,a[2]*1.9)])});
else if(s.t==='c'){if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],s.w/2,0,7);c.fill()}for(let i=1;i<p.length;i++){const g=Math.atan2(p[i][1]-p[i-1][1],p[i][0]-p[i-1][0]);c.lineWidth=s.w*(.3+2.4*Math.abs(Math.sin(g-.8)));c.beginPath();c.moveTo(p[i-1][0],p[i-1][1]);c.lineTo(p[i][0],p[i][1]);c.stroke()}}
else{if(s.t==='l')c.globalAlpha=.7;stroke0(c,s)}c.restore()}
function stroke0(c,s){const p=s.p;if(!p.length)return;c.lineCap=c.lineJoin='round';c.strokeStyle=c.fillStyle=s.c;
if(s.t==='h'){c.globalAlpha=.35;c.lineWidth=s.w*5;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);c.lineTo(p.at(-1)[0],p.at(-1)[1]);c.stroke();c.globalAlpha=1;return}
if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],s.w/2,0,7);c.fill();return}

d.addEventListener('touchmove',e=>{if(g&&e.touches.length===2){e.preventDefault();const n=G(e);Z.s=Math.min(5,Math.max(1,z0.s*n.d/g.d));Z.x=z0.x+n.x-g.x;Z.y=z0.y+n.y-g.y;zoom()}},{passive:false});
d.addEventListener('touchend',e=>{if(e.touches.length<2)g=null});
d.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)Z.s=Math.min(5,Math.max(1,Z.s*(1-e.deltaY*.01)));else{Z.x-=e.deltaX;Z.y-=e.deltaY}zoom()},{passive:false})}

async function importPdf(e){const f=e.target.files[0];if(!f)return;toast('Importando PDF…');try{const pdf=await pdfjsLib.getDocument(new Uint8Array(await f.arrayBuffer())).promise,n=Math.min(pdf.numPages,80);let at=S.i;
for(let k=1;k<=n;k++){const pg=await pdf.getPage(k),v0=pg.getViewport({scale:1}),sc=Math.min(W*2/v0.width,H*2/v0.height),v=pg.getViewport({scale:sc}),c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate((c.width-v.width)/2,(c.height-v.height)/2);await pg.render({canvasContext:x,viewport:v}).promise;
const p=mkPage(S.nb.id,0,'blank',c.toDataURL('image/jpeg',.8));S.pages.splice(++at,0,p);await db.pages.put(p);toast(`Página ${k}/${n}`)}
S.pages.forEach((x,k)=>{x.n=k+1;db.pages.put(x)});S.i++;loadPage();tools();touchNb();toast('PDF importado ✔')}catch(err){console.error(err);toast('No se pudo leer el PDF')}e.target.value=''}
async function exportPdf(){toast('Generando PDF…');await Promise.all(S.pages.flatMap(p=>p.strokes).filter(k=>k.t==='i').map(k=>ld(k.s)));const doc=new jspdf.jsPDF('p','pt',[W,H]);
for(let k=0;k<S.pages.length;k++){const pg=S.pages[k],c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);await new Promise(r=>drawPage(x,pg,r));if(k)doc.addPage([W,H]);doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,W,H)}
doc.save((S.nb.title||'cuaderno')+'.pdf');toast('PDF exportado ✔')}

// ===== Supabase: auth + sync offline-first =====
function initSb(){if(!CFG.url||!CFG.key||!window.supabase)return;sb=supabase.createClient(CFG.url,CFG.key);
sb.auth.onAuthStateChange((_,s)=>{user=s?.user||null;const el=$('#stat');if(el)el.textContent=user?'☁ '+user.email:'Solo local';if(user){sync();sb.channel('qn').on('postgres_changes',{event:'*',schema:'public'},syncSoon).subscribe()}})}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,1500)}
let syncing=false;
async function sync(){if(!sb||!user||syncing||!navigator.onLine)return;syncing=true;const el=$('#stat');try{if(el)el.textContent='⟳ sincronizando…';const last=+localStorage['qn_last_'+user.id]||0,t0=Date.now()-1500;
const ln=await db.notebooks.where('updatedAt').above(last).toArray(),lp=await db.pages.where('updatedAt').above(last).toArray();
if(ln.length){const{error}=await sb.from('notebooks').upsert(ln.map(d=>({id:d.id,user_id:user.id,data:d,updated_at:d.updatedAt})));if(error)throw error}
for(let k=0;k<lp.length;k+=10){const{error}=await sb.from('pages').upsert(lp.slice(k,k+10).map(d=>({id:d.id,user_id:user.id,notebook_id:d.notebookId,data:d,updated_at:d.updatedAt})));if(error)throw error}
for(const[tb,st]of[['notebooks',db.notebooks],['pages',db.pages]]){const{data,error}=await sb.from(tb).select('data').gt('updated_at',last);if(error)throw error;for(const r of data){const l=await st.get(r.data.id);if(!l||l.updatedAt<r.data.updatedAt){await st.put(r.data);if(tb==='pages'){delete imgs[r.data.id]}}}}
localStorage['qn_last_'+user.id]=t0;await loadNbs();
if(S.nb){const n=await db.notebooks.get(S.nb.id);if(n&&!drawing){S.nb=n;const id=cur?.id;S.pages=(await db.pages.where('notebookId').equals(n.id).toArray()).filter(p=>!p.deleted).sort((a,b)=>a.n-b.n);S.i=Math.max(0,S.pages.findIndex(p=>p.id===id));loadPage();tools()}}else if($('.shelf'))shelf();
if(el)el.textContent='☁ '+user.email}catch(e){console.error(e);if(el)el.textContent='⚠ error de sync';toast('Error de sincronización: '+(e.message||e))}finally{syncing=false}}

<label>Project URL</label><input id="cu" value="${esc(CFG.url)}" placeholder="https://xxxx.supabase.co"><label>Anon key</label><input id="ck" value="${esc(CFG.key)}">
<button style="margin-top:10px;width:100%" onclick="saveCfg()">Guardar y conectar</button>

<button style="margin-top:14px;width:100%" onclick="$('#m').remove()">Cerrar</button></div>`;document.body.appendChild(m)}
function saveCfg(){CFG.url=$('#cu').value.trim();CFG.key=$('#ck').value.trim();localStorage.qn_cfg=JSON.stringify(CFG);initSb();toast(sb?'Conectado, ahora inicia sesión':'Faltan datos')}
