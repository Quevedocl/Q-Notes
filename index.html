@keyframes bubRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

.fch{display:inline-block;width:14px;text-align:center;font-style:normal;opacity:.7;margin-right:-4px}
.fbar{margin:0 0 14px}.chip.on{outline:2px solid var(--acc,#22c55e)}
.fab{position:absolute;left:14px;bottom:70px;z-index:6;display:flex;align-items:center;gap:8px}
#lostbtn{height:58px;padding:0 22px;border-radius:29px;background:#ef4444;color:#fff;font-weight:700;font-size:16px;border:0;box-shadow:0 6px 20px #0006;touch-action:manipulation}
#lostbtn.hit{transform:scale(1.12);background:#b91c1c}
.cbn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid #22c55e88;margin:0 0 14px;box-shadow:0 6px 24px #0003}
.cbn small{display:block;opacity:.7}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #8884;border-top-color:#22c55e;margin:0 auto;animation:qvspin 1s linear infinite}@keyframes qvspin{to{transform:rotate(360deg)}}
.trl{max-height:48vh;overflow:auto;border-radius:14px;background:var(--grp)}
.trw{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid #8882;line-height:1.45;-webkit-user-select:text;user-select:text}
.trw.lost{background:#ef444422;border-left:3px solid #ef4444}
.trw .tt{font-variant-numeric:tabular-nums;font-size:12px;padding:3px 8px;min-width:48px;flex:none}.trw .tx{flex:1}.trw .ti{flex:none;padding:3px 9px}
.srow{display:grid;grid-template-columns:70px 94px 94px 1fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center}
@media(max-width:640px){.srow{grid-template-columns:1fr 1fr}}

/* ===== Q-Notes v5: tema Perla (gris perla + tarjetas blancas + esmeralda) ===== */
[data-theme=perla] html,[data-theme=perla] body,html[data-theme=perla],html[data-theme=perla] body{background:var(--bg)}
[data-theme=perla] .logo{background:none;-webkit-text-fill-color:currentColor;color:var(--tx);font-weight:600}
[data-theme=perla] .mark svg{box-shadow:none}
[data-theme=perla] header{background:rgba(255,255,255,.7);border-bottom:1px solid var(--line)}
[data-theme=perla] .side{background:rgba(255,255,255,.35)}
[data-theme=perla] .side button.on{background:transparent;color:var(--ac)}
[data-theme=perla] .srch{background:#fff;border:1.5px solid var(--line)}
[data-theme=perla] button.p{box-shadow:0 8px 20px rgba(15,95,75,.25)}
[data-theme=perla] .gr{color:var(--tx);font-weight:600;letter-spacing:-.03em}
[data-theme=perla] .hero{background:#fff;border:1px solid #e8ebed;border-radius:36px;box-shadow:0 20px 50px rgba(40,60,70,.08)}
[data-theme=perla] .hero::before{content:"Q";position:absolute;right:30px;top:-60px;width:auto;height:auto;border-radius:0;background:none;font:900 400px/1 Inter,system-ui,sans-serif;color:#c3dcd4;pointer-events:none}
[data-theme=perla] .hero small{color:var(--mut);font-weight:500;letter-spacing:.04em}
[data-theme=perla] .hero h2{font-weight:600;color:var(--tx)}
[data-theme=perla] .qa button{background:#fff;border:1.5px solid var(--ac);color:var(--tx);box-shadow:0 8px 20px rgba(40,60,70,.06)}
[data-theme=perla] .qa button:hover{background:#f1f7f5}
[data-theme=perla] .cover{box-shadow:0 14px 28px rgba(30,45,45,.22),0 2px 0 #fff2 inset}
[data-theme=perla] .nb:hover .cover{box-shadow:0 22px 38px rgba(30,45,45,.3)}
[data-theme=perla] .grid.list .nb{background:#fff;border:1px solid var(--line)}
[data-theme=perla] .box,[data-theme=perla] #mn,[data-theme=perla] .pop2,[data-theme=perla] .dock{box-shadow:0 18px 50px rgba(40,60,70,.16)}
[data-theme=perla] .pill2.err{color:#c0392b}
/* Sin avisos de sincronización: la pastilla solo aparece si hay un error real */
.pill2.hid{display:none}
/* Bloque inferior de la barra lateral: sin correo ni estado de nube */
.acct small{display:block}

/* ===== Q-Notes v6: sin zoom de página, HUD en cabecera, iPad vertical, carpetas ===== */
html,body,#app,header,.side,.modal,.box{touch-action:pan-x pan-y}
.ed,#ed,#ed canvas{touch-action:none}
.shelf{touch-action:pan-y}

header.eh .hud{position:static;right:auto;bottom:auto;left:auto;flex:none;animation:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--grp);border:0;padding:3px;gap:0}
header.eh .hud button{width:34px;height:34px}
header.eh .hud button.zp{width:auto;min-width:50px;height:34px;padding:0 6px}
header.eh .hud span{min-width:46px;padding:0 4px}
header.eh .hud .vs{margin:0 3px;height:18px}
header.eh .tt{min-width:0;flex:0 1 auto}
header.eh{gap:6px;flex-wrap:nowrap}header.eh>button{flex:none}
/* Tarjetas de carpeta */
.fcd .cover{background:linear-gradient(145deg,color-mix(in srgb,var(--fh) 26%,var(--card)),var(--card) 75%);border:1.5px solid color-mix(in srgb,var(--fh) 55%,var(--line));box-shadow:0 14px 30px #0003;padding:0;display:grid;place-items:center}
.fcd .cover::before,.fcd .cover::after{display:none}
.fcd .cover .ic{width:52px;height:52px;color:var(--fh);fill:color-mix(in srgb,var(--fh) 22%,transparent);stroke-width:1.5}
.grid.list .fcd .cover .ic{width:22px;height:22px}

@media(max-width:900px){
 .dsc{flex-wrap:wrap;overflow:visible;justify-content:center;row-gap:6px;column-gap:8px;padding:2px}

 #app .tb{width:38px;height:38px;border-radius:13px}#app .tb.sm{width:32px;height:32px}.tb .ic{width:20px;height:20px}#app .cbtn{width:38px;height:38px}.tg2{padding:2px;gap:1px}
 .hero{padding:22px;gap:20px;border-radius:28px}.hero h2{font-size:28px}.hc{width:104px}

 .side{padding:16px 10px}
 .sh{flex-wrap:wrap;gap:10px}
 .db{grid-template-columns:1fr;grid-template-rows:34% 1fr}.dl{border-right:0;border-bottom:1px solid var(--line)}
 .pop2{max-width:calc(100vw - 16px)}.pop2 .szr{min-width:0;width:100%}
 .sws{grid-template-columns:repeat(6,34px)}
 .box{max-height:94dvh}
 .tg{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
 .kb{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
}
#mn .mrow select{min-width:0;width:100%;padding:9px 28px 9px 10px;text-overflow:ellipsis}
@media(max-width:820px){.mark{display:none}}

function extractCode(t){t=String(t||'');const m=t.match(/```[\w-]*[ \t]*\r?\n([\s\S]*?)```/);if(m)return m[1].trim();const o=t.match(/```[\w-]*[ \t]*\r?\n([\s\S]*)$/);return(o?o[1]:t).trim()}

function nbObj(id){return S.nb&&S.nb.id===id?S.nb:S.nbs.find(n=>n.id===id)}
async function saveNbObj(nb){nb.updatedAt=Date.now();await db.notebooks.put(nb);syncSoon()}
function busyModal(t,sub){const m=document.createElement('div');m.className='modal';m.id='bz';m.innerHTML=`<div class="box" style="max-width:340px;text-align:center"><div class="spin"></div><h2 style="margin:14px 0 4px">${esc(t)}</h2><p class="mut sub" style="margin:0">${esc(sub||'')}</p></div>`;document.body.appendChild(m);return m}
function mdlg(html,w){const o=$('#m');o&&o.remove();const m=document.createElement('div');m.className='modal';m.id='m';m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="box" style="max-width:${w||560}px">${html}</div>`;document.body.appendChild(m);return m}
async function xCall(body,ms){if(!user||!sb)throw new Error('Inicia sesión en Ajustes para usar la IA');const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Tu sesión expiró. Vuelve a iniciar sesión en Ajustes.');const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||100000);
 try{const r=await fetch(CFG.url+'/functions/v1/ai',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:CFG.key},body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok||(j&&j.error)){const e=new Error((j&&(j.error||j.msg||j.message))||('El servidor respondió '+r.status));e.status=r.status;throw e}return j}
 catch(e){if(e.name==='AbortError')throw new Error('La IA tardó demasiado en responder.');if(e instanceof TypeError)throw new Error('No se pudo contactar a la IA. Revisa tu conexión a internet.');throw e}finally{clearTimeout(to)}}
function jsonArr(t){t=String(t||'').replace(/```json|```/g,'').trim();const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<a)throw new Error('Respuesta inesperada de la IA. Reintenta.');return JSON.parse(t.slice(a,b+1))}
const needAI=()=>{if(!user||!sb){toast('Inicia sesión en Ajustes para usar la IA');cfgModal();return false}return true};

/* ---------- Carpetas dentro de carpetas (ruta "A/B/C") ---------- */
const curFolder=()=>S.tab==='docs'&&S.folder&&S.folder!=='Todos'?S.folder:'';
function cleanPath(p){return(p||'').split('/').map(x=>x.replace(/['"<>\\`]/g,'').trim()).filter(Boolean).join('/')}
function allFolders(){const fl=JSON.parse(localStorage.qn_folders||'[]'),set=new Set();[...S.nbs.map(n=>n.folder),...fl].filter(Boolean).forEach(f=>{const p=cleanPath(f).split('/');p.forEach((_,i)=>{const q=p.slice(0,i+1).join('/');q&&set.add(q)})});return[...set].sort((a,b)=>a.localeCompare(b,'es'))}
const inFolder=(f,base)=>!!f&&(f===base||f.startsWith(base+'/'));
function folderTree(fs){window.FL=fs;const closed=new Set(JSON.parse(localStorage.qn_fclosed||'[]'));
 return fs.filter(f=>{const p=f.split('/');for(let i=1;i<p.length;i++)if(closed.has(p.slice(0,i).join('/')))return false;return true}).map(f=>{const i=fs.indexOf(f),p=f.split('/'),d=p.length-1,kids=fs.some(x=>x.startsWith(f+'/')),cl=closed.has(f);
  return `<button class="${S.tab==='docs'&&f===S.folder?'on':''}" style="padding-left:${12+d*14}px" onclick="pickFolder(${i})">${kids?`<i class="fch" onclick="event.stopPropagation();toggleFolder(${i})">${cl?'▸':'▾'}</i>`:'<i class="fch"></i>'}<i class="dotf" style="background:${hue(f)}"></i><span>${esc(p[d])}</span></button>`}).join('')}
function pickFolder(i){S.tab='docs';S.folder=window.FL[i];S.tag='';shelf()}
function goFolder(p){S.tab='docs';S.folder=p||'Todos';S.tag='';shelf()}
function toggleFolder(i){const f=window.FL[i],c=new Set(JSON.parse(localStorage.qn_fclosed||'[]'));c.has(f)?c.delete(f):c.add(f);localStorage.qn_fclosed=JSON.stringify([...c]);shelf()}
function folderBar(){if(S.tab!=='docs'||S.folder==='Todos'||S.q||S.tag)return'';const f=S.folder,p=f.split('/'),kids=allFolders().filter(x=>x.startsWith(f+'/')&&x.split('/').length===p.length+1);
 const crumbs=[['Todos','']].concat(p.map((x,i)=>[x,p.slice(0,i+1).join('/')])).map(([n,path],i,a)=>`<button class="chip ${i===a.length-1?'on':''}" onclick="goFolder('${esc(path)}')">${esc(n)}</button>`).join('<span class="mut">›</span>');
 return `<div class="fbar"><div class="chips" style="align-items:center">${crumbs}</div><div class="chips" style="align-items:center;margin-top:8px"><button class="chip" onclick="newFolder('${esc(f)}')">${ic('plus')} Subcarpeta</button><button class="chip" onclick="renameFolder()">Renombrar</button><button class="chip" onclick="deleteFolder()">Eliminar carpeta</button></div></div>`}
async function newFolder(parent){const n=await dlg.t(parent?'Nombre de la subcarpeta dentro de «'+parent.split('/').pop()+'»':'Nombre de la carpeta');const name=cleanPath((n||'').replace(/\//g,' '));if(!name)return;const path=parent?parent+'/'+name:name,f=JSON.parse(localStorage.qn_folders||'[]');if(!f.includes(path))f.push(path);localStorage.qn_folders=JSON.stringify(f);S.folder=parent||path;S.tab='docs';S.tag='';shelf();toast('Carpeta «'+name+'» creada')}
async function renameFolder(){const old=S.folder;if(old==='Todos')return;const p=old.split('/'),n=await dlg.t('Nuevo nombre',p[p.length-1]),name=cleanPath((n||'').replace(/\//g,' '));if(!name||name===p[p.length-1])return;const np=[...p.slice(0,-1),name].join('/');await moveFolder(old,np);S.folder=np;shelf()}
async function moveFolder(old,np){const re=f=>f===old?np:f.startsWith(old+'/')?np+f.slice(old.length):f;localStorage.qn_folders=JSON.stringify([...new Set(JSON.parse(localStorage.qn_folders||'[]').map(re))]);const all=await db.notebooks.toArray(),ch=all.filter(n=>n.folder&&re(n.folder)!==n.folder);for(const n of ch){n.folder=re(n.folder);n.updatedAt=Date.now()}if(ch.length)await db.notebooks.bulkPut(ch);await loadNbs();syncSoon()}
async function deleteFolder(){const f=S.folder;if(f==='Todos')return;const parent=f.split('/').slice(0,-1).join('/'),nm=f.split('/').pop();if(!await dlg.c('¿Eliminar la carpeta «'+nm+'»? Los cuadernos y subcarpetas no se borran: suben a '+(parent?'«'+parent.split('/').pop()+'»':'la raíz')+'.','Eliminar'))return;
 const up=x=>{const rest=x===f?'':x.slice(f.length+1);return[parent,rest].filter(Boolean).join('/')};localStorage.qn_folders=JSON.stringify([...new Set(JSON.parse(localStorage.qn_folders||'[]').filter(x=>x!==f).map(x=>x.startsWith(f+'/')?up(x):x))]);
 const all=await db.notebooks.toArray(),ch=all.filter(n=>inFolder(n.folder,f));for(const n of ch){n.folder=up(n.folder);n.updatedAt=Date.now()}if(ch.length)await db.notebooks.bulkPut(ch);await loadNbs();syncSoon();S.folder=parent||'Todos';shelf()}

/* ---------- PDF: logo Q&V y transcripción ---------- */
const pdfSafe=t=>String(t||'').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF•–—‘’“”…]/g,'');
function logoPdf(doc){if(localStorage.qn_logo==='0')return;try{doc.setGState(new doc.GState({opacity:1,'stroke-opacity':1}));doc.addImage(QV_LOGO,'JPEG',W-84,H-66,64,50)}catch(e){console.error(e)}}
function lostHit(pg,i){const L=pg.lost||[];if(!L.length||!pg.tr)return false;const sg=pg.tr.segs,s=sg[i][0],e=Math.min(i+1<sg.length?sg[i+1][0]:s+30,s+45);return L.some(l=>s<l+10&&e>l-40)}
function trPdf(doc){const pgs=S.pages.filter(p=>p.tr||p.sum);if(!pgs.length)return;const M=56,TW=W-2*M;let y=0;
 const np=()=>{doc.addPage([W,H]);doc.setFillColor(255,255,255);doc.rect(0,0,W,H,'F');try{doc.setGState(new doc.GState({opacity:1,'stroke-opacity':1}));if(localStorage.qn_logo!=='0')doc.addImage(QV_LOGO,'JPEG',W-M-64,26,64,50)}catch(_){}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20,80,52);doc.text(pdfSafe((S.nb.title||'Cuaderno')+' · Transcripción y apuntes'),M,52);y=100};
 const line=(txt,o={})=>{doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.s||11);doc.setTextColor(...(o.c||[30,30,30]));for(const l of doc.splitTextToSize(pdfSafe(txt),TW-(o.ind||0))){if(y>H-70)np();doc.text(l,M+(o.ind||0),y);y+=o.lh||15}};
 np();if(S.nb.sum){line('Resumen del cuaderno',{b:1,s:14,c:[20,80,52],lh:22});S.nb.sum.split('\n').forEach(l=>line(l.replace(/^## /,''),{b:/^## /.test(l)}));y+=10}
 pgs.forEach(pg=>{const k=S.pages.indexOf(pg)+1;y+=8;line('Página '+k,{b:1,s:14,c:[20,80,52],lh:22});if(pg.sum){pg.sum.split('\n').forEach(l=>line(l.replace(/^## /,''),{b:/^## /.test(l)}));y+=6}

 const sc=C.map(c=>{let s=0,hit=0;T.forEach((t,i)=>{if(!df[i])return;let m=0,p=-1;while(m<3&&(p=c.f.indexOf(t,p+1))>=0)m++;if(m){hit++;s+=Math.min(m,3)*(Math.log(1+N/df[i])+.5)}});return{c,s:s*(1+.35*hit)}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);

for(let k=0;k<S.pages.length;k++){const pg=S.pages[k],c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);await new Promise(r=>drawPage(x,{...pg,strokes:[]},r));if(k)doc.addPage([W,H]);doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,W,H);pg.strokes.forEach(t=>vecStroke(doc,t));(pg.notes||[]).forEach(n=>{doc.setFillColor(n.c);doc.rect(n.x,n.y,170,n.m?30:120,'F');doc.setTextColor(40,40,40);doc.setFontSize(13);doc.text(n.t||'',n.x+8,n.y+22,{maxWidth:154})});logoPdf(doc)}
if(withTr)trPdf(doc);
doc.save((S.nb.title||'cuaderno')+'.pdf');toast('PDF vectorial exportado ✔ (trazos nítidos al hacer zoom)')}
function vecStroke(doc,s){const h=s.c||'#000',rgb=h.length===7?[1,3,5].map(i=>parseInt(h.substr(i,2),16)):[0,0,0];doc.setDrawColor(...rgb);doc.setFillColor(...rgb);doc.setTextColor(...rgb);doc.setLineCap('round');doc.setLineJoin('round');
const al=s.t==='h'?.35:s.t==='l'?.7:1,P=s.p;doc.setGState(new doc.GState({opacity:al,'stroke-opacity':al}));
try{if(s.t==='i')doc.addImage(s.s,/png/.test(s.s.slice(0,30))?'PNG':'JPEG',P[0][0],P[0][1],P[1][0]-P[0][0],P[1][1]-P[0][1]);
else if((s.t==='l'||s.t==='br')&&P.length>1&&P[0].length>4){const bb=bbox(s),pd=s.w*5+8,Z=3,w=bb[2]-bb[0]+2*pd,h=bb[3]-bb[1]+2*pd,cv=document.createElement('canvas');cv.width=Math.ceil(w*Z);cv.height=Math.ceil(h*Z);const cx=cv.getContext('2d');cx.scale(Z,Z);cx.translate(pd-bb[0],pd-bb[1]);stroke(cx,s);doc.setGState(new doc.GState({opacity:1,'stroke-opacity':1}));doc.addImage(cv.toDataURL('image/png'),'PNG',bb[0]-pd,bb[1]-pd,w,h)}
else if(s.t==='x'&&/[^\x20-\x7E\u00A0-\u00FF\n]|[\^_]\{|(?:frac|sqrt|root)\{/.test(s.s)){const bb=bbox(s),pd=8,Z=3,w=bb[2]-bb[0]+2*pd,h=bb[3]-bb[1]+2*pd+.4*(s.w*5+10),cv=document.createElement('canvas');cv.width=Math.ceil(w*Z);cv.height=Math.ceil(h*Z);const cx=cv.getContext('2d');cx.scale(Z,Z);cx.translate(pd-bb[0],pd-bb[1]);stroke(cx,s);doc.addImage(cv.toDataURL('image/png'),'PNG',bb[0]-pd,bb[1]-pd,w,h)}
else if(s.t==='x'){doc.setFontSize(s.w*5+10);try{doc.setFont(undefined,s.b?'bold':'normal')}catch(_){}s.s.split('\n').forEach((l,i)=>doc.text(txPlain(l),P[0][0],P[0][1]+i*(s.w*6+12),{baseline:'top'}));if(s.u){const fs=s.w*5+10,n=s.s.split('\n').length,ww=Math.max(...s.s.split('\n').map(l=>doc.getTextWidth(txPlain(l))));doc.setLineWidth(Math.max(2,fs*.07));doc.line(P[0][0],P[0][1]+n*(s.w*6+12),P[0][0]+ww,P[0][1]+n*(s.w*6+12))}}
else if(s.t==='s'){doc.setLineWidth(s.w);const[a,b]=P;if(s.k==='quad')doc.lines([1,2,3].map(i=>[P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]]),P[0][0],P[0][1],[1,1],'S',true);else if(s.k==='rect')doc.rect(a[0],a[1],b[0]-a[0],b[1]-a[1],'S');else if(s.k==='ell')doc.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2||1,Math.abs(b[1]-a[1])/2||1,'S');else{doc.line(a[0],a[1],b[0],b[1]);if(s.k==='arr'){const g=Math.atan2(b[1]-a[1],b[0]-a[0]),q=14+s.w*2;[.45,-.45].forEach(d=>doc.line(b[0],b[1],b[0]+q*Math.cos(g+Math.PI+d),b[1]+q*Math.sin(g+Math.PI+d)))}}}
else{doc.setLineWidth(s.t==='h'?s.w*5:s.t==='br'?s.w*1.7:s.w);if(P.length===1)doc.circle(P[0][0],P[0][1],s.w/2,'F');else doc.lines(P.slice(1).map((a,i)=>[a[0]-P[i][0],a[1]-P[i][1]]),P[0][0],P[0][1],[1,1],'S',false)}}catch(_){}
doc.setGState(new doc.GState({opacity:1,'stroke-opacity':1}))}

document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button:not(.dot):not(.sw2):not(.zp)');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,u=document.createElement('u');u.className='rp';u.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(u);setTimeout(()=>u.remove(),600)});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const n=e.target.closest&&e.target.closest('.nb,.hc');if(!n)return;const r=n.getBoundingClientRect();n.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');n.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*12+'deg')});
document.addEventListener('pointerout',e=>{const n=e.target.closest&&e.target.closest('.nb,.hc');if(n&&!n.contains(e.relatedTarget)){n.style.removeProperty('--rx');n.style.removeProperty('--ry')}});
